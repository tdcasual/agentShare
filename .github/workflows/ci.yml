name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/control-plane-v3/package-lock.json

      - name: Bootstrap shared dev runtime
        run: PYTHON_BIN=python ./scripts/ops/bootstrap-dev-runtime.sh

      - name: Run API migrations
        working-directory: apps/api
        run: ../../.venv/bin/python -m alembic upgrade head

      - name: Lint Python (ruff)
        working-directory: apps/api
        run: ../../.venv/bin/ruff check app/ tests/

      - name: Type check Python (mypy)
        working-directory: apps/api
        run: ../../.venv/bin/mypy app/

      - name: Security scan (bandit)
        working-directory: apps/api
        run: ../../.venv/bin/bandit -r app/ -ll

      - name: Dependency audit (pip-audit)
        working-directory: apps/api
        run: ../../.venv/bin/pip-audit --desc

      - name: Run API tests (pytest)
        working-directory: apps/api
        run: ../../.venv/bin/python -m pytest tests/ -x -q --override-ini="addopts="
        env:
          ENCRYPTION_KEY: "ZGV2LW9ubHktMzItYnl0ZS1lbmNyeXB0aW9uLWtleSE="
          APP_ENV: development

      - name: Audit npm dependencies
        working-directory: apps/control-plane-v3
        run: npm audit --audit-level=high

      - name: Run unified control plane verification
        run: ./scripts/ops/verify-control-plane.sh
