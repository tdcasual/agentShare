name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag to deploy
        required: true
      environment:
        description: GitHub environment name for this deployment
        required: false
        default: production

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Compute deployment variables
        id: vars
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [[ ! "$INPUT_IMAGE_TAG" =~ ^sha-[0-9a-f]{7,40}$ ]]; then
            echo "image_tag must be an immutable sha-* tag produced by the image workflow." >&2
            exit 1
          fi
          echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=$INPUT_IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Prepare release image env
        shell: bash
        run: |
          cat > .release.env <<EOF
          API_IMAGE=ghcr.io/${{ steps.vars.outputs.owner_lc }}/vaultgate-api:${{ steps.vars.outputs.image_tag }}
          CADDY_IMAGE=ghcr.io/${{ steps.vars.outputs.owner_lc }}/vaultgate-caddy:${{ steps.vars.outputs.image_tag }}
          POSTGRES_IMAGE=ghcr.io/${{ steps.vars.outputs.owner_lc }}/vaultgate-postgres:${{ steps.vars.outputs.image_tag }}
          WEB_IMAGE=ghcr.io/${{ steps.vars.outputs.owner_lc }}/vaultgate-web:${{ steps.vars.outputs.image_tag }}
          EOF

      - name: Copy deployment assets to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true
          source: "docker-compose.prod.yml,.release.env,ops/caddy/Caddyfile,ops/compose/prod.env.example,scripts/ops/smoke-test.sh,scripts/ops/backup-postgres.sh,scripts/ops/restore-postgres.sh"

      - name: Pull and restart remote stack
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_ENV_FILE: ${{ secrets.DEPLOY_ENV_FILE }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          envs: DEPLOY_ENV_FILE,GHCR_TOKEN,GHCR_USERNAME,DEPLOY_PATH
          script: |
            set -euo pipefail
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            mkdir -p ops/caddy ops/compose scripts/ops

            if [ -z "$DEPLOY_ENV_FILE" ]; then
              echo "DEPLOY_ENV_FILE secret is required."
              exit 1
            fi

            printf '%s\n' "$DEPLOY_ENV_FILE" > .env.production

            printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            docker compose --env-file .env.production --env-file .release.env -f docker-compose.prod.yml config >/dev/null
            chmod +x scripts/ops/backup-postgres.sh scripts/ops/restore-postgres.sh scripts/ops/smoke-test.sh

            ROLLBACK_AVAILABLE=false
            : > .rollback.env
            if [ "$(docker compose --env-file .env.production --env-file .release.env -f docker-compose.prod.yml ps --services --status running | wc -l)" -eq 4 ]; then
              for service in api caddy postgres web; do
                container_id="$(docker compose --env-file .env.production --env-file .release.env -f docker-compose.prod.yml ps -q "$service")"
                image_id="$(docker inspect --format '{{.Image}}' "$container_id")"
                variable_name="$(printf '%s_IMAGE' "$service" | tr '[:lower:]' '[:upper:]')"
                printf '%s=%s\n' "$variable_name" "$image_id" >> .rollback.env
              done
              ROLLBACK_AVAILABLE=true
            fi

            if docker compose --env-file .env.production --env-file .release.env -f docker-compose.prod.yml ps --status running postgres | grep -q postgres; then
              echo "Creating pre-migration PostgreSQL backup..."
              ./scripts/ops/backup-postgres.sh
            else
              echo "No running PostgreSQL service; treating this as a fresh deployment."
            fi
            docker compose --env-file .env.production --env-file .release.env -f docker-compose.prod.yml pull

            : > .resolved-release.env
            for variable_name in API_IMAGE CADDY_IMAGE POSTGRES_IMAGE WEB_IMAGE; do
              image_reference="$(sed -n "s/^${variable_name}=//p" .release.env)"
              image_digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image_reference")"
              case "$image_digest" in
                *@sha256:*) ;;
                *) echo "Unable to resolve immutable digest for $image_reference" >&2; exit 1 ;;
              esac
              printf '%s=%s\n' "$variable_name" "$image_digest" >> .resolved-release.env
            done

            docker compose --env-file .env.production --env-file .resolved-release.env -f docker-compose.prod.yml up -d --remove-orphans

            echo "Running smoke checks through caddy (/healthz, /readyz, x-request-id)..."
            if ! ./scripts/ops/smoke-test.sh; then
              if [ "$ROLLBACK_AVAILABLE" = true ]; then
                echo "Smoke checks failed; restoring previous images."
                docker compose --env-file .env.production --env-file .rollback.env -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
                ./scripts/ops/smoke-test.sh || echo "Warning: rollback stack smoke checks also failed." >&2
                echo "Deployment failed and the previous stack was restored." >&2
              else
                echo "Deployment failed and no previous stack was available for rollback." >&2
              fi
              exit 1
            fi
            docker image prune -f
