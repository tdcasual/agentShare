[project]
name = "vaultgate-api"
version = "1.0.0"
description = "VaultGate: Simple key storage and token issuance service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.10.1",
  "uvicorn>=0.35.0",
  "sqlalchemy>=2.0",
  "alembic",
  "psycopg2-binary",
  "aiosqlite>=0.19.0",
  "asyncpg>=0.29.0",
  "bcrypt>=4.0.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1",
  "pytest-cov>=6.0",
  "fakeredis[lua]",
  "mypy>=1.0",
  "bandit>=1.7",
  "pip-audit>=2.0",
  "ruff>=0.11",
]

[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.urls]
Homepage = "https://github.com/yourusername/vaultgate"
Documentation = "https://github.com/yourusername/vaultgate/blob/main/VAULTGATE_SETUP.md"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=app --cov-fail-under=80"
