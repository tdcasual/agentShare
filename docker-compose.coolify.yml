# =============================================================================
# Coolify deployment — select this file as the compose file in the Coolify UI.
#
# This stack targets the Coolify platform (v4+): Coolify owns the edge
# (Traefik reverse proxy, managed TLS, routing), so there is intentionally
# no Caddy service and no static IPs.
#
# Network topology:
# - `default` keeps Coolify's proxy routing behavior: it is the network
#   Coolify's Traefik uses to reach the `web` service.
# - `internal` carries east-west traffic (web -> api -> postgres). `api` and
#   `postgres` are not on `default`, so under a plain `docker compose` deploy
#   nothing except `web` can reach them.
# - Note: on the Coolify platform itself, Coolify's compose parser
#   additionally attaches its own per-deployment network to every service;
#   see docs/guides/coolify-deployment.md for the exact trust boundary.
#
# Only the `web` service needs a domain assigned in Coolify. The browser
# always talks to the same-origin /api proxy inside `web`; `api` and
# `postgres` stay internal.
# =============================================================================
services:
  postgres:
    build:
      context: .
      dockerfile: apps/postgres/Dockerfile
    command:
      - postgres
      - -c
      - fsync=on
      - -c
      - synchronous_commit=on
      - -c
      - full_page_writes=on
      - -c
      - wal_compression=on
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaultgate}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---data-checksums}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/var/lib/postgresql/backups
      - ${VAULTGATE_SECRETS_DIR:-./.vaultgate-secrets}:/run/secrets/vaultgate:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vaultgate}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      # Leave DATABASE_URL empty to wire the API to the bundled postgres
      # service through the structured POSTGRES_* settings below. Set it
      # explicitly (URL-encoded) only when using an external database.
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vaultgate}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENCRYPTION_KEY_FILE: ${ENCRYPTION_KEY_FILE:-}
      ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID:-current}
      ENCRYPTION_KEYRING: ${ENCRYPTION_KEYRING:-{}}
      ENCRYPTION_KEYRING_FILE: ${ENCRYPTION_KEYRING_FILE:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      BOOTSTRAP_TOKEN_FILE: ${BOOTSTRAP_TOKEN_FILE:-}
      SESSION_SECURE: ${SESSION_SECURE:-true}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-vaultgate_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      # X-Forwarded-For is only accepted from these proxies. The API is not on
      # the `default` network, so under a plain compose deploy only `web` can
      # reach it; on Coolify the platform additionally attaches its
      # per-deployment network to every service. The wide Docker bridge range
      # stays acceptable because Docker isolates bridge networks from each
      # other. Narrow to the deployment subnet (docker network inspect) when
      # known.
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_IP_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_IP_MAX_ATTEMPTS:-20}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      LAST_USED_WRITE_INTERVAL_SECONDS: ${LAST_USED_WRITE_INTERVAL_SECONDS:-300}
      CREDENTIAL_RETENTION_DAYS: ${CREDENTIAL_RETENTION_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      IDEMPOTENCY_RETENTION_DAYS: ${IDEMPOTENCY_RETENTION_DAYS:-7}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-2097152}
      MIGRATION_LOCK_TIMEOUT_SECONDS: ${MIGRATION_LOCK_TIMEOUT_SECONDS:-120}
      RUN_DB_MIGRATIONS_ON_STARTUP: ${RUN_DB_MIGRATIONS_ON_STARTUP:-true}
    expose:
      - "8000"
    volumes:
      - ${VAULTGATE_SECRETS_DIR:-./.vaultgate-secrets}:/run/secrets/vaultgate:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"

  web:
    build:
      context: .
      dockerfile: apps/control-plane-v3/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      VAULTGATE_API_URL: ${VAULTGATE_API_URL:-http://api:8000}
      VAULTGATE_API_TIMEOUT_MS: ${VAULTGATE_API_TIMEOUT_MS:-30000}
    expose:
      - "3000"
    networks:
      - default
      - internal
    labels:
      # The proxy only joins Coolify's per-resource network. Pin Traefik to
      # that network so it cannot select the unreachable default/internal IP.
      - "traefik.docker.network=${COOLIFY_RESOURCE_UUID:-coolify}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((res)=>{if(!res.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
      - /srv/vaultgate/apps/control-plane-v3/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

networks:
  # `default` preserves Coolify's proxy routing behavior (Traefik reaches
  # `web` here); `internal` isolates api/postgres east-west traffic.
  default: {}
  internal: {}

volumes:
  postgres-data:
  postgres-backups:
