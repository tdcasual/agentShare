services:
  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE is required}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./ops/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: 172.30.0.2
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    depends_on:
      api:
        condition: service_healthy
    environment:
      VAULTGATE_API_URL: ${VAULTGATE_API_URL:-http://api:8000}
      VAULTGATE_API_TIMEOUT_MS: ${VAULTGATE_API_TIMEOUT_MS:-30000}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((res)=>{if(!res.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edge
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
      - /srv/vaultgate/apps/control-plane-v3/.next/cache
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_FILE: ${DATABASE_URL_FILE:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vaultgate}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ENCRYPTION_KEY_FILE: ${ENCRYPTION_KEY_FILE:-}
      ENCRYPTION_ACTIVE_KEY_ID: ${ENCRYPTION_ACTIVE_KEY_ID:-current}
      ENCRYPTION_KEYRING: ${ENCRYPTION_KEYRING:-{}}
      ENCRYPTION_KEYRING_FILE: ${ENCRYPTION_KEYRING_FILE:-}
      BOOTSTRAP_TOKEN: ${BOOTSTRAP_TOKEN:-}
      BOOTSTRAP_TOKEN_FILE: ${BOOTSTRAP_TOKEN_FILE:-}
      SESSION_SECURE: "true"
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-vaultgate_session}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.0.2/32}
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:-5}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}
      LAST_USED_WRITE_INTERVAL_SECONDS: ${LAST_USED_WRITE_INTERVAL_SECONDS:-300}
      CREDENTIAL_RETENTION_DAYS: ${CREDENTIAL_RETENTION_DAYS:-30}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      IDEMPOTENCY_RETENTION_DAYS: ${IDEMPOTENCY_RETENTION_DAYS:-7}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-2097152}
      MIGRATION_LOCK_TIMEOUT_SECONDS: ${MIGRATION_LOCK_TIMEOUT_SECONDS:-120}
    expose:
      - "8000"
    volumes:
      - ${VAULTGATE_SECRETS_DIR:-./.vaultgate-secrets}:/run/secrets/vaultgate:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - edge
      - data
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"

  postgres:
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE is required}
    command:
      - postgres
      - -c
      - fsync=on
      - -c
      - synchronous_commit=on
      - -c
      - full_page_writes=on
      - -c
      - wal_compression=on
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT_SECONDS:-300}s
      - -c
      - archive_command=test ! -f /var/lib/postgresql/wal-archive/%f && cp %p /var/lib/postgresql/wal-archive/%f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaultgate}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---data-checksums}
    volumes:
      - ${POSTGRES_DATA_LOCATION:-postgres-data}:/var/lib/postgresql/data
      - ${POSTGRES_WAL_ARCHIVE_LOCATION:-postgres-wal-archive}:/var/lib/postgresql/wal-archive
      - ${VAULTGATE_SECRETS_DIR:-./.vaultgate-secrets}:/run/secrets/vaultgate:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-vaultgate}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - data
    restart: unless-stopped
    stop_grace_period: 2m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Keep Docker's dynamic allocations away from Caddy's trusted proxy IP.
          ip_range: 172.30.0.128/25
  data:

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  postgres-wal-archive:
